[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-kag-mcp"
version = "0.1.0"
description = "Read-only MCP access plane for OS Abyss repository knowledge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.0.0",
  "pydantic>=2.11,<3",
]

[project.scripts]
aoa-kag-mcp = "aoa_kag_mcp.cli:main"
aoa-kag-mcp-server = "aoa_kag_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
