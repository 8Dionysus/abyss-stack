[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-kag-mcp"
version = "0.1.0"
description = "MCP access plane for AoA KAG provider maps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27.2,<2",
]

[project.scripts]
aoa-kag-mcp = "aoa_kag_mcp.cli:main"
aoa-kag-mcp-server = "aoa_kag_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
