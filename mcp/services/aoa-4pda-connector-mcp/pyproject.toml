[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-4pda-connector-mcp"
version = "0.2.0"
description = "MCP access plane for the AoA 4PDA connector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.1.1",
]

[project.scripts]
aoa-4pda-connector-mcp = "aoa_4pda_connector_mcp.cli:main"
aoa-4pda-connector-mcp-server = "aoa_4pda_connector_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
