[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abyss-machine-mcp"
version = "0.1.0"
description = "MCP access plane for Abyss Machine host read models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0",
]

[project.scripts]
abyss-machine-mcp = "abyss_machine_mcp.cli:main"
abyss-machine-mcp-server = "abyss_machine_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
