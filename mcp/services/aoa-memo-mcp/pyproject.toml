[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-memo-mcp"
version = "0.2.0"
description = "MCP access plane for OS Abyss memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.0",
  "mcp>=2,<3",
  "PyYAML>=6.0",
]

[project.scripts]
aoa-memo-mcp = "aoa_memo_mcp.cli:main"
aoa-memo-mcp-server = "aoa_memo_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
