[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-memo-mcp"
version = "0.1.0"
description = "MCP access plane for OS Abyss memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0",
  "PyYAML>=6.0",
]

[project.scripts]
aoa-memo-mcp = "aoa_memo_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
