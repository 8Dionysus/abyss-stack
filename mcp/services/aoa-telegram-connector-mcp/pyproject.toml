[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-telegram-connector-mcp"
version = "0.2.0"
description = "MCP access plane for the AoA Telegram connector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
]

[project.scripts]
aoa-telegram-connector-mcp = "aoa_telegram_connector_mcp.cli:main"
aoa-telegram-connector-mcp-server = "aoa_telegram_connector_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
