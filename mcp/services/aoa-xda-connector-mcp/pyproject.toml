[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-xda-connector-mcp"
version = "0.1.0"
description = "Read-only MCP access plane for the AoA XDA connector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
]

[project.scripts]
aoa-xda-connector-mcp = "aoa_xda_connector_mcp.cli:main"
aoa-xda-connector-mcp-server = "aoa_xda_connector_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
