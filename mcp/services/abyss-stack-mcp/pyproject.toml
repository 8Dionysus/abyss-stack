[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abyss-stack-mcp"
version = "0.4.0"
description = "Owner-bounded runtime observation, candidate, and exact internal-effect MCP for abyss-stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==48.0.0",
  "mcp==1.27.2",
  "pydantic==2.13.4",
]

[project.scripts]
abyss-stack-mcp = "abyss_stack_mcp.cli:main"
abyss-stack-mcp-audit = "abyss_stack_mcp.audit:main"
abyss-stack-mcp-canary = "abyss_stack_mcp.canary:main"
abyss-stack-mcp-observe = "abyss_stack_mcp.observation:main"
abyss-stack-mcp-overlay-compose = "abyss_stack_mcp.overlay:main"
abyss-stack-mcp-proof-project = "abyss_stack_mcp.proof_projection:main"
abyss-stack-mcp-proof-packet-bind-consumer = "abyss_stack_mcp.proof_packet:main"
abyss-stack-mcp-rollback-candidate = "abyss_stack_mcp.rollback_candidate:main"
abyss-stack-mcp-rollback-project = "abyss_stack_mcp.rollback_projection:main"
abyss-stack-mcp-orchestration = "abyss_stack_mcp.orchestration:main"
abyss-stack-mcp-effect = "abyss_stack_mcp.effect:main"
abyss-stack-mcp-effect-server = "abyss_stack_mcp.effect_server:main"
abyss-stack-mcp-server = "abyss_stack_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abyss_stack_mcp = ["runtime-targets.v1.json"]
