[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-decisions-mcp"
version = "0.1.0"
description = "MCP access plane for AoA workspace decision graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0",
]

[project.scripts]
aoa-decisions-mcp = "aoa_decisions_mcp.cli:main"
aoa-decisions-mcp-server = "aoa_decisions_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
