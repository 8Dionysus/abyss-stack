[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-evals-mcp"
version = "0.1.0"
description = "MCP access plane for OS Abyss bounded eval proof surfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0",
]

[project.scripts]
aoa-evals-mcp = "aoa_evals_mcp.cli:main"
aoa-evals-mcp-server = "aoa_evals_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
