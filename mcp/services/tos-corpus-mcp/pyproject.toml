[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tos-corpus-mcp"
version = "0.2.0"
description = "MCP access plane for the Tree of Sophia corpus index"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
]

[project.scripts]
tos-corpus-mcp = "tos_corpus_mcp.cli:main"
tos-corpus-mcp-server = "tos_corpus_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
