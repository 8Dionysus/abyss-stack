[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-session-memory-mcp"
version = "0.2.0"
description = "MCP access plane for AoA session evidence and route intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.0.0",
]

[project.scripts]
aoa-session-memory-mcp = "aoa_session_memory_mcp.cli:main"
aoa-session-memory-mcp-server = "aoa_session_memory_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aoa_session_memory_mcp = ["organ-access.v1.json", "organ-access.schema.json"]
