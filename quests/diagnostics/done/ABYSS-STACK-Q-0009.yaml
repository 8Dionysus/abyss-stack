notes: >
  The live runtime cutover read-only pass found the source and deployed mirror
  ready, but live cutover was blocked by route-api health and closure drift.
  On 2026-05-14, after explicit operator instruction to complete all remaining
  points, the root cause was traced to the systemd user-unit runtime selection:
  the live federated consumer was enabled, but the durable unit shape selected
  intel-full without layering the federation profile, so a systemd restart
  removed route-api as out of shape. The repair keeps the checked-in unit
  generic, writes one host-local runtime-selection drop-in, preserves intel-full,
  and layers federation. The follow-up gates then passed. This closes the
  specific drift without granting future source closeout permission to start,
  stop, restart, or repair runtime services without operator intent.
