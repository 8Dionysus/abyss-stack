service:
  name: tos-graph
  port: 5410

source:
  corpus_index: ToS/derived-exports/tos_corpus_index.min.json
  philosophy_atlas_projection: ToS/derived-exports/philosophy_atlas_projection.min.json
  philosophy_graph_views: ToS/derived-exports/philosophy_graph_views.min.json
  philosophy_graph_projection: ToS/derived-exports/philosophy_graph_projection.min.json
  philosophy_post_planting_audit: ToS/philosophy/graph-workbench/review-packets/table-i-post-planting-audit.json

projection:
  mode: corpus_and_philosophy_sync
  database: neo4j
  neo4j_shadow: true

ui:
  mode: philosophy_review_workbench
  corpus_first: false
  default_view: corpus-topology
  default_philosophy_view: chronology
