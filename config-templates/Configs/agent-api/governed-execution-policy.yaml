{
  "surface_type": "runtime_governed_execution_policy",
  "schema_version": "v1",
  "policy_id": "agentic-governed-execution-v1",
  "description": "Fail-closed governed mutation policy for abyss-stack; playbook meaning stays generic while runtime permissions remain owner-bound.",
  "enabled": true,
  "global_rules": {
    "gate_mode": "fail_closed",
    "canonical_gate_command": "aoa-status --autonomy --json",
    "default_target_id": "abyss-stack",
    "require_clean_repo": true,
    "require_stable_base_head": true,
    "approval_milestones": [
      "plan_freeze",
      "landing"
    ],
    "max_worktree_repairs": 1,
    "auto_rollback_on_post_apply_failure": true,
    "break_glass_requires_reason": true,
    "log_root": "local:/srv/AbyssOS/abyss-stack/Logs/governed-runs",
    "promotion_criteria": {
      "canary_proven": {
        "minimum_successful_runs": 2,
        "minimum_task_classes": 1,
        "maximum_scope_violations": 0,
        "maximum_rollback_failures": 0,
        "maximum_break_glass_runs": 0,
        "maximum_post_change_validation_failures": 0
      },
      "trusted": {
        "minimum_successful_runs": 5,
        "minimum_task_classes": 3,
        "maximum_scope_violations": 0,
        "maximum_rollback_failures": 0,
        "maximum_break_glass_runs": 0,
        "maximum_post_change_validation_failures": 0
      }
    },
    "repo_scope_expansion_gate": {
      "minimum_successful_runs": 5,
      "minimum_task_classes": 3,
      "maximum_scope_violations": 0,
      "maximum_rollback_failures": 0,
      "maximum_break_glass_runs": 0,
      "maximum_post_change_validation_failures": 0
    }
  },
  "targets": {
    "abyss-stack": {
      "repo_scope": "abyss-stack",
      "description": "Internal governed target for runtime-owned stack control, policy, and operator surfaces.",
      "default_repo_root": "~/src/abyss-stack",
      "playbooks": {
        "AOA-P-0011": {
          "enabled": true,
          "execution_kind": "mutation",
          "repo_scope": "abyss-stack",
          "trust_state": "canary_proven",
          "task_class": "docs_only",
          "allowed_files": [
            "docs/*.md",
            "docs/**/*.md",
            "config-templates/Configs/agent-api/governed-execution-policy.yaml",
            "config-templates/Configs/agent-api/governed-canary-catalog.json",
            "mechanics/governed-execution/parts/runtime-contracts/schemas/runtime-governed-execution-policy.schema.json",
            "mechanics/governed-execution/parts/runtime-contracts/schemas/runtime-governed-execution-request.schema.json",
            "mechanics/governed-execution/parts/runtime-contracts/schemas/runtime-governed-execution-canary-catalog.schema.json",
            "scripts/validate_stack.py",
            ".github/workflows/validate-stack.yml"
          ],
          "acceptance_commands": [
            "python scripts/validate_stack.py"
          ],
          "break_glass_allowed": false,
          "repair_allowed": true
        },
        "AOA-P-0018": {
          "enabled": true,
          "execution_kind": "mutation",
          "repo_scope": "abyss-stack",
          "trust_state": "canary_proven",
          "task_class": "governed_lane",
          "allowed_files": [
            "docs/*.md",
            "docs/**/*.md",
            "config-templates/Configs/agent-api/governed-execution-policy.yaml",
            "config-templates/Configs/agent-api/governed-canary-catalog.json",
            "mechanics/governed-execution/parts/runtime-contracts/schemas/runtime-governed-execution-policy.schema.json",
            "mechanics/governed-execution/parts/runtime-contracts/schemas/runtime-governed-execution-request.schema.json",
            "mechanics/governed-execution/parts/runtime-contracts/schemas/runtime-governed-execution-canary-catalog.schema.json",
            "mechanics/governed-execution/parts/governed-runner/aoa_governed_execution.py",
            "scripts/aoa-governed-run",
            "scripts/validate_stack.py",
            "mechanics/governed-execution/parts/governed-runner/tests/test_governed_runner_*.py",
            "mechanics/governed-execution/parts/governed-runner/tests/governed_runner_test_support.py",
            ".github/workflows/validate-stack.yml"
          ],
          "acceptance_commands": [
            "python scripts/validate_stack.py",
            "python -m py_compile mechanics/governed-execution/parts/governed-runner/aoa_governed_execution.py scripts/aoa-governed-run scripts/validate_stack.py",
            "python -m pytest mechanics/governed-execution/parts/governed-runner/tests"
          ],
          "break_glass_allowed": true,
          "repair_allowed": true
        },
        "AOA-P-0002": {
          "enabled": false,
          "execution_kind": "mutation",
          "repo_scope": "abyss-stack",
          "trust_state": "experimental",
          "task_class": "policy_surface",
          "allowed_files": [],
          "acceptance_commands": [],
          "break_glass_allowed": false,
          "repair_allowed": false
        },
        "AOA-P-0019": {
          "enabled": false,
          "execution_kind": "mutation",
          "repo_scope": "abyss-stack",
          "trust_state": "experimental",
          "task_class": "validation_tightening",
          "allowed_files": [],
          "acceptance_commands": [],
          "break_glass_allowed": false,
          "repair_allowed": false
        }
      }
    }
  },
  "boundaries": {
    "owns_runtime_permissions_only": true,
    "does_not_define_playbook_meaning": true,
    "does_not_replace_route_api_advisory_surfaces": true,
    "does_not_replace_langchain_api_federated_advisory_run": true,
    "external_targets_require_explicit_policy": true
  }
}
