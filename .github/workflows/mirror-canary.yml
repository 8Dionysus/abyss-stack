name: mirror-canary

on:
  schedule:
    - cron: "53 4 * * 1,5"
  workflow_dispatch:

jobs:
  parity-canary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Run source-rooted mirror canary
        run: |
          export AOA_STACK_ROOT="$RUNNER_TEMP/abyss-stack-canary"
          export AOA_CONFIGS_ROOT="$AOA_STACK_ROOT/Configs"
          export AOA_VAULT_ROOT="$RUNNER_TEMP/abyss-vault-canary"
          mkdir -p "$AOA_VAULT_ROOT"

          python scripts/validate_stack.py
          scripts/aoa-install-layout
          scripts/aoa-sync-configs --delete
          python scripts/validate_stack.py --parity-check --deployed-configs-root "$AOA_CONFIGS_ROOT"
