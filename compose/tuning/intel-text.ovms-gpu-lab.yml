services:
  ovms-intel-text:
    image: docker.io/openvino/model_server:2026.1-gpu@sha256:22f92a1a5ad6784384e47296c43bde239887a623e75de45b0e1802659de416a6
    container_name: ovms-intel-text
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AOA_OVMS_TEXT_REST_HOST_PORT:-8300}:8000"
      - "127.0.0.1:${AOA_OVMS_TEXT_GRPC_HOST_PORT:-9300}:9000"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Models/ovms-text-lab:/models:U,Z"
    command:
      - --source_model
      - "${AOA_OVMS_TEXT_SOURCE_MODEL:?set AOA_OVMS_TEXT_SOURCE_MODEL from MODEL_CARDS.md}"
      - --model_repository_path
      - /models
      - --rest_port
      - "8000"
      - --port
      - "9000"
      - --task
      - text_generation
      - --target_device
      - "${AOA_OVMS_TEXT_TARGET_DEVICE:-GPU}"
      - --max_num_seqs
      - "${AOA_OVMS_TEXT_MAX_NUM_SEQS:-1}"
      - --max_num_batched_tokens
      - "${AOA_OVMS_TEXT_MAX_BATCHED_TOKENS:-512}"
      - --cache_size
      - "${AOA_OVMS_TEXT_CACHE_SIZE_GB:-0}"
      - --log_level
      - INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/config >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s

  langchain-api-intel-text:
    build: "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/langchain-api"
    container_name: langchain-api-intel-text
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Secrets/Configs/langchain-api.env"
    environment:
      LC_BASE_URL: "http://ovms-intel-text:8000/v3"
      LC_API_KEY: "${AOA_OVMS_TEXT_API_KEY:-EMPTY}"
      LC_MODEL: "${AOA_OVMS_TEXT_MODEL_NAME:?set AOA_OVMS_TEXT_MODEL_NAME from MODEL_CARDS.md}"
      LC_TIMEOUT_S: 300
      LC_OLLAMA_NATIVE_CHAT: "false"
      LC_OPENAI_LITERAL_COMPLETIONS: "true"
      AOA_FEDERATED_RUN_ENABLED: "false"
      EMBEDDINGS_PROVIDER: "disabled"
    depends_on:
      ovms-intel-text:
        condition: service_healthy
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/agent-api/return-policy.yaml:/app/config/return-policy.yaml:ro,Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Logs/returns-intel-text:/app/logs/returns-intel-text:Z"
    ports:
      - "127.0.0.1:${AOA_INTEL_TEXT_LANGCHAIN_HOST_PORT:-5404}:5401"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5401/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped
