# Candidate elastic helper-service posture for explicit tools profile runs.
# This does not make tools resident; owner lifecycle still controls residency.
services:
  qwen-tts:
    labels:
      aoa.tuning.overlay: "tools.thin-host"
      aoa.tuning.posture: "candidate"
    cpus: "0"
    mem_limit: "0"
    mem_reservation: "${AOA_QWEN_TTS_MEM_RESERVATION:-1g}"
    environment:
      OMP_NUM_THREADS: "${AOA_QWEN_TTS_OMP_NUM_THREADS:-2}"
      MKL_NUM_THREADS: "${AOA_QWEN_TTS_MKL_NUM_THREADS:-2}"
      NUMEXPR_NUM_THREADS: "${AOA_QWEN_TTS_NUMEXPR_NUM_THREADS:-2}"

  tts-router:
    labels:
      aoa.tuning.overlay: "tools.thin-host"
      aoa.tuning.posture: "candidate"
    cpus: "0"
    mem_limit: "0"
    mem_reservation: "${AOA_TTS_ROUTER_MEM_RESERVATION:-64m}"

  docs-api:
    labels:
      aoa.tuning.overlay: "tools.thin-host"
      aoa.tuning.posture: "candidate"
    cpus: "0"
    mem_limit: "0"
    mem_reservation: "${AOA_DOCS_API_MEM_RESERVATION:-64m}"

  aoa-browser:
    labels:
      aoa.tuning.overlay: "tools.thin-host"
      aoa.tuning.posture: "candidate"
    cpus: "0"
    mem_limit: "0"
    mem_reservation: "${AOA_BROWSER_MEM_RESERVATION:-256m}"
