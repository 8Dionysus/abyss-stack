# Candidate elastic Intel worker posture for workstation runs.
# Use only with `intel-worker` or presets that include it.
services:
  langchain-api:
    labels:
      aoa.tuning.overlay: "intel-worker.thin-host"
      aoa.tuning.posture: "candidate"
    cpus: "0"
    mem_limit: "0"
    mem_reservation: "${AOA_LANGCHAIN_MEM_RESERVATION:-192m}"
