# Candidate elastic federation facade posture for workstation runs.
# Use only with the `federation` profile or presets that include it.
services:
  route-api:
    labels:
      aoa.tuning.overlay: "federation.thin-host"
      aoa.tuning.posture: "candidate"
    cpus: "0"
    mem_limit: "0"
    mem_reservation: "${AOA_ROUTE_API_MEM_RESERVATION:-128m}"
