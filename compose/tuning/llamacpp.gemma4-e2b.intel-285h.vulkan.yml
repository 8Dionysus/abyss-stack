# Candidate Gemma 4 E2B text lane for the Intel Core Ultra 9 285H host class.
# This overlay keeps the Intel-aware stack split explicit:
# - llama.cpp/Vulkan owns the Gemma 4 E2B GGUF text lane.
# - OVMS continues to own the reviewed embeddings lane in intel-worker.
# It is intentionally text-only and does not mount a multimodal projector.
services:
  llama-cpp:
    image: "${AOA_LLAMACPP_VULKAN_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:dca559dd886b415b4ced54f09197a2d84b55c432736a3a3fccca82359444f50c}"
    command:
      - "--sleep-idle-seconds"
      - "600"
    labels:
      aoa.tuning.overlay: "llamacpp.gemma4-e2b.intel-285h.vulkan"
      aoa.tuning.host_class: "intel-core-ultra-9-285h"
      aoa.tuning.model: "gemma4-e2b-it-gguf"
      aoa.tuning.posture: "candidate"
      aoa.tuning.source: "abyss-machine-gemma4-e2b-resident-trials"
    security_opt:
      - label=disable
    devices:
      - /dev/dri:/dev/dri
    cpus: "0"
    # Explicit unlimited values clear hard caps inherited from earlier tuning
    # overlays; native idle sleep owns release for this important lane.
    mem_limit: "0"
    mem_reservation: "4g"
    environment:
      LLAMA_ARG_ALIAS: "gemma4-e2b-it"
      LLAMA_ARG_MODEL: "/models/gemma4-e2b-it.gguf"
      LLAMA_ARG_CTX_SIZE: "4096"
      LLAMA_ARG_THREADS: "4"
      LLAMA_ARG_THREADS_BATCH: "4"
      LLAMA_ARG_THREADS_HTTP: "2"
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_BATCH: "128"
      LLAMA_ARG_UBATCH: "64"
      LLAMA_ARG_CACHE_TYPE_K: "f16"
      LLAMA_ARG_CACHE_TYPE_V: "f16"
      LLAMA_ARG_MMAP: "1"
      LLAMA_ARG_MLOCK: "0"
      LLAMA_ARG_KV_OFFLOAD: "1"
      LLAMA_ARG_N_GPU_LAYERS: "99"
      LLAMA_ARG_DEVICE: "Vulkan0"
      LLAMA_ARG_FLASH_ATTN: "auto"
      LLAMA_ARG_FIT: "on"
      LLAMA_ARG_FIT_TARGET: "1024"
      LLAMA_ARG_FIT_CTX: "4096"
      LLAMA_ARG_CACHE_PROMPT: "0"
      LLAMA_ARG_CACHE_RAM: "0"
      LLAMA_ARG_CACHE_REUSE: "0"
      LLAMA_ARG_ENDPOINT_METRICS: "1"
      LLAMA_ARG_ENDPOINT_SLOTS: "1"
      LLAMA_ARG_JINJA: "1"
      LLAMA_ARG_REASONING: "off"
      LLAMA_ARG_THINK: "none"
      LLAMA_ARG_OP_OFFLOAD: "1"
    volumes:
      - "${AOA_GEMMA4_E2B_MODEL_HOST_PATH:-/srv/abyss-machine/cache/ai/gemma4/e2b/gemma-4-E2B-it-UD-Q4_K_XL.gguf}:/models/qwen3.5-9b.gguf:ro"
      - "${AOA_GEMMA4_E2B_MODEL_HOST_PATH:-/srv/abyss-machine/cache/ai/gemma4/e2b/gemma-4-E2B-it-UD-Q4_K_XL.gguf}:/models/gemma4-e2b-it.gguf:ro"
  langchain-api:
    environment:
      AOA_LLAMACPP_MODEL_ALIAS: "gemma4-e2b-it"
      AOA_RUNTIME_CHAT_MODEL: "gemma4-e2b-it"
      LC_MODEL: "gemma4-e2b-it"
      LC_OPENAI_LITERAL_COMPLETIONS: "false"
