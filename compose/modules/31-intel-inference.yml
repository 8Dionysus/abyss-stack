services:
  ovms:
    image: docker.io/openvino/model_server:2026.1-gpu@sha256:22f92a1a5ad6784384e47296c43bde239887a623e75de45b0e1802659de416a6
    container_name: ovms
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8000"
      - "127.0.0.1:9200:9000"
    devices:
      - /dev/dri:/dev/dri
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Secrets/Configs/ovms-api.env"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Models/ovms:/models:Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Secrets/Configs/ovms_api_key.txt:/run/secrets/ovms_api_key:ro,Z"
    command:
      - --config_path
      - /models/config.json
      - --port
      - "9000"
      - --rest_port
      - "8000"
      - --log_level
      - INFO
      - --api_key_file
      - /run/secrets/ovms_api_key
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v2/health/live >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 20
