services: {}

# The intel-worker profile selects this owner workload, but Compose does not
# create it. Rootless systemd socket activation owns the container lifecycle.
x-abyss-owner-workloads:
  ovms:
    container_unit: abyss-ovms.service
    activation_sockets:
      - abyss-ovms.socket
      - abyss-ovms-unix.socket
    proxy_unit: abyss-ovms-proxy.service
