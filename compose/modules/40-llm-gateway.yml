services:
  litellm:
    container_name: litellm
    build:
      context: /srv/abyss/Services/litellm
      args:
        LITELLM_BASE_IMAGE: docker.litellm.ai/berriai/litellm:main-stable
    image: localhost/litellm-custom:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      LITELLM_LOG: DEBUG
      LITELLM_SET_VERBOSE: "true"
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    volumes:
      - /srv/abyss/Services/litellm/config.yaml:/app/config.yaml:ro,Z
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 4000), 2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
