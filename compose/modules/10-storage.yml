services:
  neo4j:
    image: docker.io/library/neo4j@sha256:0e5d68ed655a64fe57296cc8e1b928f48456462dbf2c46d50a25c47b93ea938b
    env_file:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Configs/stack.env"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Services/neo4j:/data:Z"
    restart: unless-stopped

  qdrant:
    image: docker.io/qdrant/qdrant@sha256:0425e3e03e7fd9b3dc95c4214546afe19de2eb2e28ca621441a56663ac6e1f46
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Services/qdrant:/qdrant/storage:Z"
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres@sha256:d4c3314b2dd74ff23cd6cd07e4d7e737cb6ef791c22a7cbd744cfbfb4815df72
    env_file:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Configs/stack.env"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Services/postgres:/var/lib/postgresql/data:Z"
    restart: unless-stopped

  redis:
    image: docker.io/library/redis@sha256:7fc0068cee4c9e73e3709705c626d0d4fc1dc2019d0cee58cb0f88f76184ee2b
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Services/redis:/data:Z"
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
