services:
  neo4j:
    image: docker.io/neo4j:5
    env_file:
      - /srv/abyss/Configs/stack.env
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - /srv/abyss/Services/neo4j:/data:Z
    restart: unless-stopped

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - /srv/abyss/Services/qdrant:/qdrant/storage:Z
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16
    env_file:
      - /srv/abyss/Configs/stack.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /srv/abyss/Services/postgres:/var/lib/postgresql/data:Z
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /srv/abyss/Services/redis:/data:Z
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
