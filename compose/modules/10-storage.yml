services:
  neo4j:
    image: docker.io/library/neo4j:5.26.26-community@sha256:f27aaa05476f3e7be0c7cf03988c60c97c4e95b80a2fb3c79a6b39a813e1065c
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/stack.env"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/neo4j:/data:Z"
    restart: unless-stopped

  qdrant:
    image: docker.io/qdrant/qdrant:v1.18.0@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/qdrant:/qdrant/storage:Z"
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16.13@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/stack.env"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/postgres:/var/lib/postgresql/data:Z"
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7.4.9@sha256:3e1b24a1a8f24ff926b15e5ace8c38a03e5657fb66e1fc7e5188e315aa5fa094
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/redis:/data:Z"
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
