services:
  neo4j:
    image: docker.io/library/neo4j:5.26.26-community@sha256:0b5d3ab6ec1b866890dbfb53bf4fe1cf039f9e03c96165599a403005b7e7bcc3
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/stack.env"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/neo4j:/data:Z"
    restart: unless-stopped

  qdrant:
    image: docker.io/qdrant/qdrant:v1.18.1@sha256:45f8e3ddc2570a4d029877e1b5ec1045c19b3852b4e22a55c7f43b05aea0ca89
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/qdrant:/qdrant/storage:Z"
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16.14@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/stack.env"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/postgres:/var/lib/postgresql/data:Z"
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7.4.9@sha256:d3be87a1060455213a204d2b0a7f04d45d19a16a98e85b3c37b7c33b5f0c489e
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/redis:/data:Z"
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
