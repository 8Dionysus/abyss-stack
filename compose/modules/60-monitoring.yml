services:
  prometheus:
    image: docker.io/prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z"
      - "prometheus_data:/prometheus:Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro,Z"
    restart: unless-stopped
    depends_on:
      - loki
      - alloy

  cadvisor:
    container_name: cadvisor
    image: ghcr.io/google/cadvisor:v0.57.0@sha256:e75bdb03b74b0b6995f208f166fead2e6e555dde73e44200113bb26f41b1981d
    privileged: true
    security_opt:
      - label=disable
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - "/:/rootfs:ro"
      - "/sys:/sys:ro"
      - "/dev/disk:/dev/disk:ro"
      - "/etc/machine-id:/etc/machine-id:ro"
      - "${AOA_PODMAN_CONTAINERS_ROOT}:/var/lib/containers:ro"
      - "/run/user/${AOA_RUNTIME_UID:-1000}/podman:/var/run/podman:ro"
    restart: unless-stopped

  alertmanager:
    image: docker.io/prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z"
      - "alertmanager_data:/alertmanager:Z"
    restart: unless-stopped

  loki:
    container_name: loki
    image: docker.io/grafana/loki:3.7.0@sha256:c316b7c7589a5eeca843b6926c7446149d18300b79ac8538dc4ae063bc478da2
    command:
      - "-config.file=/etc/loki/loki.yml"
      - "-config.expand-env=true"
    expose:
      - "3100"
    environment:
      AOA_LOKI_RETENTION_PERIOD: "${AOA_LOKI_RETENTION_PERIOD:-48h}"
      AOA_LOKI_INGESTION_RATE_MB: "${AOA_LOKI_INGESTION_RATE_MB:-4}"
      AOA_LOKI_INGESTION_BURST_SIZE_MB: "${AOA_LOKI_INGESTION_BURST_SIZE_MB:-8}"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro,Z"
      - "loki_data:/loki:Z"
    restart: unless-stopped

  tempo:
    container_name: tempo
    image: docker.io/grafana/tempo:2.9.2@sha256:3f0825e14397d3459e11e96f99ddd3976ec0cb75e328459e173298d9fb74b407
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    ports:
      - "127.0.0.1:3200:3200"
    expose:
      - "4317"
      - "4318"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro,Z"
      - "tempo_data:/var/tempo:Z"
    restart: unless-stopped

  alloy:
    container_name: alloy
    image: docker.io/grafana/alloy:v1.16.1@sha256:51aeb9d829239345070619dad3edd6873186f913c84f45b365b74574fcb38ec0
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    expose:
      - "12345"
    security_opt:
      - label=disable
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro,Z"
      - "${AOA_PODMAN_CONTAINERS_ROOT}:/var/lib/containers:ro"
      - "/var/log/journal:/var/log/journal:ro"
      - "/run/log/journal:/run/log/journal:ro"
      - "alloy_data:/var/lib/alloy/data:Z"
    restart: unless-stopped
    depends_on:
      - loki
      - tempo

  grafana:
    image: docker.io/grafana/grafana:13.0.1@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminadmin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_METRICS_ENABLED: "true"
    volumes:
      - "grafana_data:/var/lib/grafana:Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z"
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus_data: {}
  alertmanager_data: {}
  loki_data: {}
  tempo_data: {}
  alloy_data: {}
  grafana_data: {}
