services:
  prometheus:
    image: docker.io/prom/prometheus@sha256:38c3b05c3bc744ff1b0b7b4eb82196026442845e62a1e2073795565da506d7a2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Configs/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z"
      - "prometheus_data:/prometheus:Z"
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Configs/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro,Z"
    restart: unless-stopped

  cadvisor:
    container_name: cadvisor
    image: ghcr.io/google/cadvisor@sha256:5534ae91cbf3428998d60428d107cfdd97272d80658534ac6e54d8ce3b0c4d72
    privileged: true
    security_opt:
      - label=disable
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - "/:/rootfs:ro"
      - "/sys:/sys:ro"
      - "/dev/disk:/dev/disk:ro"
      - "/etc/machine-id:/etc/machine-id:ro"
      - "/home/${AOA_RUNTIME_USER:-dionysus}/.local/share/containers:/var/lib/containers:ro"
      - "/run/user/${AOA_RUNTIME_UID:-1000}/podman:/var/run/podman:ro"
    restart: unless-stopped

  alertmanager:
    image: docker.io/prom/alertmanager@sha256:220da6995a919b9ee6e0d3da7ca5f09802f3088007af56be22160314d2485b54
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Configs/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z"
      - "alertmanager_data:/alertmanager:Z"
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana@sha256:5c1eb28c96c2a8a103384183fb2c32f9cb499904b310b9ba8cdd6bdae435509a
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminadmin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "grafana_data:/var/lib/grafana:Z"
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Configs/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z"
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data: {}
  alertmanager_data: {}
  grafana_data: {}
