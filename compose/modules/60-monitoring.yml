services:
  prometheus:
    image: docker.io/prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z"
      - "prometheus_data:/prometheus:Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro,Z"
    restart: unless-stopped

  cadvisor:
    container_name: cadvisor
    image: ghcr.io/google/cadvisor:v0.57.0@sha256:e75bdb03b74b0b6995f208f166fead2e6e555dde73e44200113bb26f41b1981d
    privileged: true
    security_opt:
      - label=disable
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - "/:/rootfs:ro"
      - "/sys:/sys:ro"
      - "/dev/disk:/dev/disk:ro"
      - "/etc/machine-id:/etc/machine-id:ro"
      - "/home/${AOA_RUNTIME_USER:-dionysus}/.local/share/containers:/var/lib/containers:ro"
      - "/run/user/${AOA_RUNTIME_UID:-1000}/podman:/var/run/podman:ro"
    restart: unless-stopped

  alertmanager:
    image: docker.io/prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z"
      - "alertmanager_data:/alertmanager:Z"
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:13.0.1@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminadmin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "grafana_data:/var/lib/grafana:Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z"
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data: {}
  alertmanager_data: {}
  grafana_data: {}
