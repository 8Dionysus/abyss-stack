services:
  langchain-api:
    environment:
      EMBEDDINGS_PROVIDER: ovms
      OVMS_EMBEDDINGS_UNIX_SOCKET: /run/abyss-stack/ovms.sock
      OVMS_EMBEDDINGS_API_KEY_FILE: /run/secrets/ovms_api_key
      OVMS_EMBEDDINGS_TIMEOUT_S: "180"
    volumes:
      - "${XDG_RUNTIME_DIR:-/run/user/${AOA_RUNTIME_UID:-1000}}/abyss-stack:/run/abyss-stack:ro,z"
    secrets:
      - source: abyss-ovms-api-key
        target: /run/secrets/ovms_api_key
        uid: "0"
        gid: "0"
        mode: "0400"
    depends_on:
      llama-cpp:
        condition: service_started

secrets:
  abyss-ovms-api-key:
    external: true
