services:
  qwen-tts:
    build: "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/qwen3-tts-api"
    container_name: qwen-tts
    environment:
      HF_HOME: /models/hf
      TRANSFORMERS_CACHE: /models/hf/transformers
      HUGGINGFACE_HUB_CACHE: /models/hf/hub
      QWEN_TTS_DEFAULT_MODEL: /models/hf/local/Qwen3-TTS-12Hz-1.7B-CustomVoice
      AOA_TTS_LOCAL_ONLY: "1"
      QWEN_TTS_LOCAL_PREFIX: /models/hf/local/
      QWEN_TTS_DEVICE: cpu
      QWEN_TTS_DTYPE: float32
      QWEN_TTS_OUT_DIR: /out
      HF_HUB_DISABLE_SYMLINKS: "1"
      HF_HUB_ETAG_TIMEOUT: "120"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Models/hf/local:/models/hf/local:ro,Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Logs/tts:/out:z,U"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Models/voices:/voices:ro,Z"
    ports:
      - "127.0.0.1:5101:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  tts-router:
    build: "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/tts_router"
    container_name: tts-router
    ports:
      - "127.0.0.1:5201:5201"
    environment:
      VOICE_CFG: /cfg/voices.yaml
      TTS_HOST_LOG_DIR: "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Logs/tts"
      TTS_BACKEND_URL: http://qwen-tts:5001/custom
      TTS_LOG_DIR: /logs
      VOICE_STORE: /voices
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/tts:/cfg:ro,Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Logs/tts:/logs:z,U"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Models/voices:/voices:ro,Z"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5201/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      qwen-tts:
        condition: service_healthy
