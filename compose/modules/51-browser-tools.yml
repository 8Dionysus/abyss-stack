services:
  docs-api:
    build: /srv/abyss/Services/docs-api
    image: localhost/aoa-docs-api:0.2
    container_name: docs-api
    restart: unless-stopped
    volumes:
      - /srv/abyss/Knowledge/n8n-docs:/docs/n8n-docs:ro,z
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  aoa-browser:
    image: localhost/aoa-browser-img:latest
    container_name: aoa-browser
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PYTHONUNBUFFERED: "1"
    volumes:
      - /srv/abyss/Services/aoa-browser/ms-playwright:/ms-playwright:rw,Z,U
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
