services:
  n8n:
    image: docker.io/n8nio/n8n@sha256:5bf25e23d65895ddde4ce42cf6ad1bc1b09673f16fbe824bd48f1baffe84937a
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/stack.env"
    environment:
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_NATIVE_PYTHON_RUNNER: "true"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/n8n:/home/node/.n8n:Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Knowledge/n8n-docs:/docs/n8n-docs:ro,z"
    depends_on:
      - postgres
    restart: unless-stopped

  n8n-task-runners:
    image: docker.io/n8nio/runners@sha256:37a3a6930604fd54c9b52e43660e4962c9f1a60fa8be7154eb44a610abb1ea41
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/stack.env"
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: "5680"
    depends_on:
      - n8n
    restart: unless-stopped
