services:
  n8n:
    image: docker.io/n8nio/n8n:2.23.1@sha256:a0aa4012094eec804c17ef8014b1e397a337d33f63faebf33b439388ada93289
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/stack.env"
    environment:
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_NATIVE_PYTHON_RUNNER: "true"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/n8n:/home/node/.n8n:Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Knowledge/n8n-docs:/docs/n8n-docs:ro,z"
    depends_on:
      - postgres
    restart: unless-stopped

  n8n-task-runners:
    image: docker.io/n8nio/runners:2.23.1@sha256:36b8e303dea63c0181f606c8a8a028662571b71277d81f06558e033b2f542797
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/stack.env"
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: "5680"
    depends_on:
      - n8n
    restart: unless-stopped
