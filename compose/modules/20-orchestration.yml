services:
  n8n:
    image: docker.io/n8nio/n8n@sha256:5bf25e23d65895ddde4ce42cf6ad1bc1b09673f16fbe824bd48f1baffe84937a
    env_file:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/stack.env"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/n8n:/home/node/.n8n:Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Knowledge/n8n-docs:/docs/n8n-docs:ro,z"
    depends_on:
      - postgres
    restart: unless-stopped
