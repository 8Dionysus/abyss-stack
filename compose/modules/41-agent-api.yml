services:
  langchain-api:
    build: "${AOA_STACK_ROOT:-/srv/abyss-stack}/Services/langchain-api"
    container_name: langchain-api
    env_file:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Secrets/Configs/langchain-api.env"
    environment:
      AOA_RUNTIME_CHAT_BASE_URL: "${AOA_RUNTIME_CHAT_BASE_URL:-http://llama-cpp:8080/v1}"
      AOA_RUNTIME_CHAT_API_KEY: "${AOA_RUNTIME_CHAT_API_KEY:-EMPTY}"
      AOA_RUNTIME_CHAT_MODEL: "${AOA_RUNTIME_CHAT_MODEL:-qwen3.5:9b}"
      AOA_LLAMACPP_MODEL_ALIAS: "${AOA_LLAMACPP_MODEL_ALIAS:-qwen3.5:9b}"
      LC_TIMEOUT_S: 300
      LC_OLLAMA_THINK: "false"
      LC_OLLAMA_NATIVE_CHAT: "${LC_OLLAMA_NATIVE_CHAT:-false}"
      LC_OPENAI_LITERAL_COMPLETIONS: "true"
      LC_OLLAMA_NATIVE_CHAT_URL: http://ollama:11434/api/chat
      LC_OLLAMA_NUM_THREAD: "${LC_OLLAMA_NUM_THREAD:-6}"
      LC_OLLAMA_NUM_BATCH: "${LC_OLLAMA_NUM_BATCH:-32}"
      AOA_RETURN_ENABLED: "${AOA_RETURN_ENABLED:-true}"
      AOA_RETURN_POLICY_PATH: "${AOA_RETURN_POLICY_PATH:-/app/config/return-policy.yaml}"
      AOA_RETURN_LOG_ROOT: "${AOA_RETURN_LOG_ROOT:-/app/logs/returns}"
      AOA_ROUTE_API_BASE_URL: "${AOA_ROUTE_API_BASE_URL:-http://route-api:5402}"
      EMBEDDINGS_PROVIDER: "${AOA_EMBEDDINGS_PROVIDER:-disabled}"
      OVMS_EMBEDDINGS_URL: "${AOA_OVMS_EMBEDDINGS_URL:-http://ovms:8000/v3/embeddings}"
      OVMS_EMBEDDINGS_MODEL: "${AOA_OVMS_EMBEDDINGS_MODEL:-qwen3-embed-0.6b-int8-ov}"
      OLLAMA_EMBEDDINGS_URL: http://ollama:11434/api/embed
      OLLAMA_EMBEDDINGS_FALLBACK_URL: http://ollama:11434/api/embeddings
      OLLAMA_EMBEDDINGS_MODEL: nomic-embed-text
    volumes:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Configs/agent-api/return-policy.yaml:/app/config/return-policy.yaml:ro,Z"
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Logs/returns:/app/logs/returns:Z"
    depends_on:
      llama-cpp:
        condition: service_started
    ports:
      - "127.0.0.1:${AOA_LANGCHAIN_HOST_PORT:-5403}:5401"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5401/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
