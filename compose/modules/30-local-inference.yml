services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Services/ollama:/root/.ollama:Z"
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Models/gguf:/models:ro,Z"
      - "${AOA_STACK_ROOT:-/srv/abyss-stack}/Configs/ollama:/cfg:Z"
    ports:
      - "127.0.0.1:11434:11434"
