services:
  ollama:
    image: docker.io/ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Services/ollama:/root/.ollama:Z"
      - "${AOA_STACK_ROOT:-/srv/AbyssOS/abyss-stack}/Configs/ollama:/cfg:Z"
    ports:
      - "127.0.0.1:11434:11434"
